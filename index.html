<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dropnote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  :root {
    --bg: #fbf8f3; --card: #ffffff; --ink: #2b2622; --muted: #6b625a; --line: #e6ded3;
    --soft: #f3ece0; --amber: #f0b04a; --amber-soft: #fbe6bd; --sage: #3f6b63; --danger: #b3261e; --heart: #e5484d;
    /* iOS-like curves */
    --ease: cubic-bezier(.25, .1, .25, 1);
    --spring: cubic-bezier(.32, .72, 0, 1);
    --spring-bounce: cubic-bezier(.34, 1.56, .64, 1);
    --press: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    font-family: "Noto Sans Thai", "Sarabun", "Thonburi", "Helvetica Neue", system-ui, sans-serif;
    font-size: 18px; line-height: 1.7; background: var(--bg); color: var(--ink);
    min-height: 100vh; min-height: 100dvh; padding-bottom: calc(96px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    scroll-behavior: smooth;
    overscroll-behavior-y: contain;
  }
  button, input, textarea, select { font-family: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 20px 8px; }
  header {
    margin-bottom: 22px; display: flex; justify-content: space-between;
    align-items: flex-start; gap: 8px;
  }
  header > div:first-child { min-width: 0; flex: 1; }
  .brand { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .brand #logo { width: 20px; height: 24px; flex: none; }
  h1 {
    font-size: 20px; line-height: 1.15; margin: 0; font-weight: 700;
    white-space: nowrap;
  }
  .tag { margin: 3px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .lang { display: flex; gap: 2px; flex: none; background: var(--soft); padding: 2px; border-radius: 999px; }
  .lang button {
    min-width: 34px; height: 30px; border-radius: 999px; border: 0; background: transparent;
    font-size: 12px; font-weight: 700; cursor: pointer; color: var(--muted); padding: 0 5px;
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  .lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  @media (min-width: 360px) {
    h1 { font-size: 22px; }
    .brand #logo { width: 22px; height: 27px; }
    .tag { font-size: 14px; }
    .lang button { min-width: 36px; height: 32px; font-size: 12px; padding: 0 6px; }
  }
  @media (min-width: 400px) {
    h1 { font-size: 26px; }
    .brand #logo { width: 26px; height: 32px; }
    .tag { font-size: 15px; }
    .lang button { min-width: 40px; height: 34px; font-size: 13px; padding: 0 7px; }
  }
  @media (min-width: 440px) {
    h1 { font-size: 28px; }
    .tag { font-size: 16px; }
    .lang button { min-width: 44px; height: 36px; font-size: 14px; padding: 0 8px; }
  }

  .view { display: none; }
  .view.on { display: block; }
  h2 { font-size: 19px; margin: 32px 0 10px; }
  .hint { color: var(--muted); font-size: 16px; margin: 0 0 12px; }

  .banner { display: none; background: var(--soft); border-radius: 12px; padding: 12px 16px; font-size: 15px; margin-bottom: 18px; }
  .banner.err { background: #fbe4e1; color: var(--danger); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; padding: 0; border: 0; min-width: 0; }
  .pick { position: relative; }
  .pick input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .pick span {
    display: inline-flex; align-items: center; min-height: 44px; padding: 6px 16px; border-radius: 999px;
    border: 2px solid var(--line); background: var(--card); font-size: 16px;
    transition: background .2s, color .2s, border-color .2s;
  }
  .pick input:checked + span { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pick input:focus-visible + span { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* icons */
  .ic { display: inline-flex; flex: none; }
  .ic svg { width: 24px; height: 24px; display: block; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  /* note card */
  .note {
    border: 1px solid var(--line); border-radius: 24px; padding: 26px 22px 8px; min-height: 220px; background: var(--card);
    box-shadow: 0 1px 2px rgba(43, 38, 34, .04), 0 18px 36px -18px rgba(43, 38, 34, .22);
  }
  .note.empty {
    display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted);
    background: transparent; border: 2px dashed var(--line); box-shadow: none; padding: 26px 22px;
  }
  .note .text { font-size: 22px; line-height: 1.7; margin: 0 0 12px; white-space: pre-wrap; word-break: break-word; }
  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
  .meta.sub { font-size: 14px; }

  /* action bar: separate icon buttons, same style */
  .bar { display: flex; align-items: center; margin: 10px -6px 0; padding: 6px 0 4px; border-top: 1px solid var(--line); }
  .bar .spacer { flex: 1; }
  .act {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 46px; min-height: 46px; padding: 0 10px;
    border: 0; background: transparent; color: var(--muted); border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: color .2s, background .2s, transform .15s var(--ease);
  }
  .act:active { transform: scale(.88); }
  .act[aria-pressed="true"] .ic svg { fill: currentColor; }
  .act.heart[aria-pressed="true"] { color: var(--heart); }
  .act.mark[aria-pressed="true"] { color: var(--sage); }
  .act.talk[aria-expanded="true"] { color: var(--ink); }
  .act.danger:active { color: var(--danger); }

  .replies { border-top: 1px solid var(--line); margin: 0 0 8px; padding-top: 10px; }
  .reply { padding: 8px 0; font-size: 16px; }
  .reply .rm { font-size: 14px; color: var(--muted); }
  .reply p { margin: 0; word-break: break-word; white-space: pre-wrap; }
  .link { background: none; border: 0; color: var(--muted); font-size: 14px; text-decoration: underline; cursor: pointer; min-height: 36px; padding: 0 4px; }
  .replyform { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .replyform input { flex: 1; min-width: 0; font-size: 17px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 2px solid transparent; border-radius: 16px; font-size: 20px; font-weight: 700;
    min-height: 58px; padding: 14px; margin-top: 20px; cursor: pointer; background: var(--amber); color: var(--ink);
    box-shadow: 0 8px 18px -8px rgba(240, 176, 74, .9);
    transition: transform .15s var(--ease), box-shadow .2s, opacity .2s, border-color .2s;
  }
  .btn:not(.ghost) { border-color: var(--amber); }
  .btn:active { transform: scale(.975); box-shadow: 0 3px 8px -4px rgba(240, 176, 74, .9); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.small { width: auto; min-height: 48px; font-size: 17px; padding: 8px 20px; margin-top: 0; }
  .btn.ghost {
    background: transparent; box-shadow: none;
    border: 2px solid var(--line); color: var(--ink);
  }
  .btn.ghost:active { background: var(--soft); }
  .btn .ic svg { width: 22px; height: 22px; }
  .stat { text-align: center; color: var(--muted); font-size: 15px; margin-top: 14px; }

  .lb { display: block; font-weight: 700; margin: 18px 0 6px; }
  textarea, input[type=text] {
    width: 100%; font-size: 19px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px;
    transition: border-color .2s;
  }
  textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
  textarea:focus, input[type=text]:focus { border-color: var(--ink); outline: none; }
  .row { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 15px; margin: 6px 2px 0; }
  .msg { margin-top: 14px; font-size: 16px; min-height: 26px; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--sage); font-weight: 600; }

  .item { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px 4px; margin-bottom: 12px; }
  .item p { margin: 0 0 4px; word-break: break-word; white-space: pre-wrap; }
  .item .bar { margin-top: 6px; }
  .summary { background: var(--soft); border-radius: 16px; padding: 14px 16px; margin-bottom: 8px; font-size: 16px; }

  /* bottom nav */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, .92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom);
  }
  nav .inner { display: flex; width: 100%; max-width: 560px; }
  nav button {
    flex: 1; border: 0; background: transparent; font-size: 14px; color: var(--muted); min-height: 68px; cursor: pointer; padding: 8px 2px 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.3;
    transition: color .2s;
  }
  nav .pill { display: inline-flex; padding: 4px 20px; border-radius: 999px; transition: background .3s var(--ease); }
  nav button:active .pill { transform: scale(.94); }
  nav button[aria-current="page"] { color: var(--ink); font-weight: 700; }
  nav button[aria-current="page"] .pill { background: var(--amber-soft); }

  /* dialogs */
  dialog {
    max-height: 92vh; max-height: 92dvh; overflow-y: auto; width: min(92vw, 420px); border: 0; border-radius: 24px; padding: 0;
    max-width: min(92vw, 420px); background: var(--bg); color: var(--ink); box-shadow: 0 28px 60px -14px rgba(0, 0, 0, .45);
  }
  dialog::backdrop { background: rgba(43, 38, 34, .5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .dlgin { padding: 20px; }
  dialog p { margin: 0 0 12px; }
  .dlgbtns { display: flex; gap: 10px; justify-content: stretch; margin-top: 18px; }
  .dlgbtns .btn { flex: 1; margin-top: 0; min-height: 50px; font-size: 16px; padding: 10px 8px; border-radius: 14px; }
  .dlgbtns.two .btn {
    flex: 1 1 0; margin-top: 0; min-height: 52px; min-width: 0;
    font-size: 15px; font-weight: 700; padding: 10px 8px;
    white-space: nowrap; gap: 6px;
  }
  .dlgbtns.two .btn .ic { flex: none; }
  .dlgbtns.two .btn .ic svg { width: 20px; height: 20px; }
  .dlgbtns.sticky { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 2px; margin-top: 4px; }
  .shHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .shHead strong { font-size: 19px; }
  .x { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--soft); color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0; transition: transform .15s var(--ease); }
  .x:active { transform: scale(.9); }
  .x .ic svg { width: 20px; height: 20px; }
  #shareImg {
    width: auto; max-width: 100%; max-height: 42vh; margin: 0 auto; border-radius: 14px; display: block;
    box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .4);
    -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto;
    touch-action: manipulation; cursor: pointer;
  }
  .swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; border: 0; padding: 2px; margin: 16px 0 6px; min-width: 0; }
  .sw { position: relative; display: block; }
  .sw input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .sw .dot {
    display: block; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(135deg, var(--a), var(--b));
    border: 2px solid rgba(43, 38, 34, .14); position: relative; transition: transform .25s var(--ease), box-shadow .25s var(--ease);
  }
  .sw .dot::after { content: ""; position: absolute; width: 34%; height: 34%; border-radius: 50%; background: var(--c); right: 12%; bottom: 12%; }
  .sw input:checked + .dot { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); transform: scale(.92); }
  .sw input:focus-visible + .dot { outline: 3px solid var(--ink); outline-offset: 4px; }
  .swName { text-align: center; color: var(--muted); font-size: 15px; margin: 0 0 10px; min-height: 24px; }
  #shFmt { justify-content: center; margin-bottom: 4px; }


  /* write box: faint hint + counter live inside the field */
  .tawrap { position: relative; }
  .tawrap textarea { display: block; margin: 0; min-height: 170px; padding-bottom: 42px; }
  .tawrap .inhint, .tawrap .incnt { position: absolute; bottom: 12px; font-size: 14px; color: var(--muted); opacity: .6; pointer-events: none; line-height: 1.3; }
  .tawrap .inhint { left: 16px; }
  .tawrap .incnt { right: 16px; font-variant-numeric: tabular-nums; }
  .tawrap:focus-within .inhint, .tawrap:focus-within .incnt { opacity: .8; }

  /* ---- motion ---- */
  .view.on { animation: none; }
  .view.on > * { animation: rise .5s var(--ease) both; }
  .view.on > *:nth-child(2) { animation-delay: .06s; }
  .view.on > *:nth-child(3) { animation-delay: .12s; }
  .view.on > *:nth-child(4) { animation-delay: .18s; }
  .view.on > *:nth-child(5) { animation-delay: .24s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .note.drop { animation: dropIn .75s cubic-bezier(.2, 1.15, .35, 1) both; transform-origin: 50% 0; }
  @keyframes dropIn {
    0% { opacity: 0; transform: translateY(-46px) rotate(-2.2deg) scale(.95); }
    55% { opacity: 1; transform: translateY(7px) rotate(.7deg) scale(1.005); }
    100% { opacity: 1; transform: none; }
  }
  .note.drop > :not(.bigheart) { animation: rise .55s var(--ease) both; }
  .note.drop > :nth-child(1) { animation-delay: .14s; }
  .note.drop > :nth-child(2) { animation-delay: .22s; }
  .note.drop > :nth-child(3) { animation-delay: .28s; }
  .note.drop > :nth-child(4) { animation-delay: .36s; }
  .replies { animation: rise .35s var(--ease) both; }

  .act { position: relative; }
  .act .ic svg { fill: transparent; }
  .bar .act { flex: 1; min-width: 0; padding: 0; }
  .act .cnt { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--ink); color: #fff; font-size: 11px; line-height: 17px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; pointer-events: none; }
  .act .cnt:empty { display: none; }
  .act.heart[aria-pressed="true"] .cnt { background: var(--heart); }
  .act.pop .ic { animation: heartPop .38s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes heartPop { 0% { transform: scale(1); } 45% { transform: scale(1.28); } 100% { transform: scale(1); } }
  .act.snap .ic { animation: snapMark .45s cubic-bezier(.3, 1.5, .5, 1); transform-origin: 50% 100%; }
  @keyframes snapMark { 0% { transform: scale(1); } 35% { transform: scale(.85, 1.12); } 70% { transform: scale(1.08, .96); } 100% { transform: scale(1); } }

  .btn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .45) 50%, transparent 70%); transform: translateX(-120%); pointer-events: none; }
  .btn { position: relative; overflow: hidden; }
  .btn.shine::after { animation: shine .8s var(--ease); }
  @keyframes shine { to { transform: translateX(120%); } }

  nav button[aria-current="page"] .pill { animation: pillIn .45s cubic-bezier(.2, 1.4, .4, 1); }
  nav button[aria-current="page"] .ic { animation: navHop .45s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pillIn { from { transform: scaleX(.5); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes navHop { 0% { transform: translateY(3px) scale(.85); } 60% { transform: translateY(-3px) scale(1.1); } 100% { transform: none; } }

  dialog[open] { animation: sheetIn .42s cubic-bezier(.2, 1.1, .35, 1); }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(34px) scale(.96); } to { opacity: 1; transform: none; } }
  dialog[open]::backdrop { animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  #shareImg.swap { animation: swap .4s var(--ease); }
  @keyframes swap { from { opacity: .25; transform: scale(.965); } to { opacity: 1; transform: none; } }
  .sw input:checked + .dot { animation: selPop .4s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes selPop { 0% { transform: scale(.7); } 100% { transform: scale(.92); } }
  .msg.ok, .msg.err { animation: rise .3s var(--ease); }

  /* platform sheet */
  #platDlg { margin: auto auto 0; width: 100%; max-width: 520px; border-radius: 26px 26px 0 0; padding-bottom: env(safe-area-inset-bottom); }
  #platDlg[open] { animation: sheetUp .45s cubic-bezier(.2, 1.05, .3, 1); }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  .plats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 6px; padding: 4px 0 6px; }
  .plat { border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); line-height: 1.25; animation: rise .45s var(--ease) both; }
  .plat .tile { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 26px; transition: transform .18s var(--ease); box-shadow: 0 8px 16px -8px rgba(0, 0, 0, .45); }
  .plat:active .tile { transform: scale(.86); }
  .plat .tile svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .t-instagram { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
  .t-tiktok { background: #111; }
  .plat .t-facebook { background: #1877f2; font-family: Georgia, serif; font-size: 34px; }
  .plat .t-line { background: #06c755; font-size: 14px; letter-spacing: -.2px; }
  .t-x { background: #000; }
  .t-copy { background: var(--soft); color: var(--ink); box-shadow: none; }
  .t-more { background: var(--ink); }


  /* share dialog: compact controls that expand on tap */
  .ctrls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 16px 0 8px; }
  .ctrl { display: flex; align-items: center; gap: 6px; min-height: 52px; padding: 6px 8px; border: 2px solid var(--line); background: var(--card); border-radius: 16px; cursor: pointer; text-align: left; min-width: 0; transition: border-color .2s, background .2s, transform .15s var(--ease); }
  .ctrl:active { transform: scale(.96); }
  .ctrl[aria-expanded="true"] { border-color: var(--ink); background: var(--soft); }
  .cdot { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--ink); background: var(--soft); position: relative; }
  .cdot.th { background: linear-gradient(135deg, var(--a), var(--b)); border: 2px solid rgba(43, 38, 34, .14); }
  .cdot.th::after { content: ""; position: absolute; width: 34%; height: 34%; border-radius: 50%; background: var(--c); right: 8%; bottom: 8%; }
  .cdot .shape { display: block; border: 2px solid currentColor; border-radius: 3px; transition: width .25s var(--ease), height .25s var(--ease); }
  .ctext { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .ctext small { font-size: 11px; color: var(--muted); }
  .ctext b { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pan { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .38s var(--ease); }
  .pan.open { grid-template-rows: 1fr; }
  .pan > div { overflow: hidden; min-height: 0; visibility: hidden; opacity: 0; transition: opacity .25s ease, visibility 0s .38s; }
  .pan.open > div { visibility: visible; opacity: 1; transition: opacity .3s ease .08s, visibility 0s; }
  .pan .swatches { margin: 12px 0 2px; }
  .pan .chips { margin: 12px 0 2px; justify-content: center; }
  .fonts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; border: 0; padding: 2px; margin: 12px 0 2px; min-width: 0; }
  .fo { position: relative; display: block; }
  .fo input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .fo .box { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--card); transition: border-color .2s, background .2s, transform .2s var(--ease); }
  .fo .box b { font-size: 21px; font-weight: 400; line-height: 1.35; }
  .fo .box small { font-size: 12px; color: var(--muted); }
  .fo input:checked + .box { border-color: var(--ink); background: var(--soft); }
  .fo input:active + .box { transform: scale(.97); }
  .fo input:focus-visible + .box { outline: 3px solid var(--ink); outline-offset: 2px; }


  /* ---- v3: smoother, calmer ---- */
  html, body, button, .note { touch-action: manipulation; }

  /* text panel */

  .seg { display: flex; gap: 4px; background: var(--soft); padding: 4px; border-radius: 14px; }
  .segb { flex: 1; min-height: 44px; border: 0; background: transparent; border-radius: 10px; cursor: pointer; color: var(--muted); display: grid; place-items: center; transition: background .2s, color .2s, box-shadow .2s; }
  .segb[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px -3px rgba(0, 0, 0, .3); }
  .segb svg, .cdot svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .row2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .stepper { display: flex; align-items: center; gap: 4px; background: var(--soft); border-radius: 14px; padding: 4px; }
  .stb { width: 50px; height: 44px; border: 0; border-radius: 10px; background: var(--card); font-size: 16px; font-weight: 700; cursor: pointer; transition: transform .15s var(--ease), opacity .2s; }
  .stb:active { transform: scale(.92); }

  .szv { flex: 1; min-width: 64px; text-align: center; font-weight: 700; font-size: 15px; border: 0; background: none; cursor: pointer; min-height: 44px; }
  .qt { white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-size: 15px; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
  .qt b { font-family: Georgia, serif; font-size: 26px; line-height: 1; }
  .qt[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* category chips + theme previews */
  .cats { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; margin: 12px -2px 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .cats::-webkit-scrollbar { display: none; }
  .catb { flex: none; min-height: 38px; padding: 0 15px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .2s, color .2s, border-color .2s, transform .15s var(--ease); }
  .catb:active { transform: scale(.94); }
  .catb[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pan .swatches { grid-template-columns: repeat(4, 1fr); gap: 14px 10px; margin: 6px 0 2px; }
  .sw .dot { aspect-ratio: 5 / 3; border-radius: 14px; }
  .sw .dot::before { content: ""; position: absolute; left: 22%; right: 22%; top: 16%; bottom: 16%; border-radius: 6px; background: var(--k, transparent); border: 1.5px solid var(--kb, transparent); }
  .sw .dot::after { width: 26%; height: 5px; border-radius: 3px; left: 37%; right: auto; bottom: 27%; }
  .swn { display: block; text-align: center; font-size: 12px; line-height: 1.3; margin-top: 6px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sw input:checked ~ .swn { color: var(--ink); font-weight: 700; }

    .fsz { margin: 12px 0 0; }
  .fsz .stb { flex: 1; }
  .fsz .szv { flex: none; min-width: 48px; font-size: 20px; }

  /* v11: favourites, auto-theme, shuffle, watermark */
  .sw { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .sw .dot { transition: transform .25s var(--ease), box-shadow .25s var(--ease); }

  .favhint { grid-column: 1 / -1; text-align: center; margin: 14px 0 6px; }

  /* ========== iOS-fluid polish (visible) ========== */
  html { scroll-behavior: smooth; }
  @supports (font: -apple-system-body) {
    body { font-family: -apple-system, "SF Pro Text", "Noto Sans Thai", "Sarabun", "Thonburi", system-ui, sans-serif; }
  }

  /* every tappable: longer spring + clear press dim */
  .act, .btn, .lang button, .catb, .ctrl, .plat, .stb, .qt, .x, .segb, nav button, .pick span {
    -webkit-user-select: none; user-select: none;
  }
  .act, .lang button, .catb, .ctrl, .stb, .qt, .x, .segb {
    transition:
      transform .32s var(--spring),
      background .28s var(--ease),
      color .28s var(--ease),
      border-color .28s var(--ease),
      box-shadow .28s var(--ease),
      opacity .2s var(--ease) !important;
  }
  .act:active, .lang button:active, .catb:active, .ctrl:active,
  .stb:active, .qt:active, .x:active, .segb:active {
    transform: scale(.9) !important;
    opacity: .85;
  }
  .btn {
    transition: transform .3s var(--spring), box-shadow .3s var(--ease), background .3s var(--ease), opacity .2s !important;
  }
  .btn:active {
    transform: scale(.96) !important;
    box-shadow: 0 2px 8px -4px rgba(240, 176, 74, .7) !important;
  }
  .plat:active .tile { transform: scale(.84) !important; transition: transform .22s var(--spring); }
  nav button:active .pill { transform: scale(.9); }

  /* note card — big, obvious bounce when a note lands */
  .note {
    transition: box-shadow .4s var(--spring), border-color .3s var(--ease), background .3s var(--ease);
  }
  .note.drop {
    animation: dropIn .7s var(--spring-bounce) both !important;
  }
  @keyframes dropIn {
    0%   { opacity: 0; transform: translateY(-40px) scale(.92); }
    55%  { opacity: 1; transform: translateY(6px) scale(1.02); }
    75%  { transform: translateY(-2px) scale(.995); }
    100% { opacity: 1; transform: none; }
  }
  .note.out {
    animation: noteOut .22s var(--press) forwards !important;
  }
  @keyframes noteOut {
    to { opacity: 0; transform: translateY(16px) scale(.96); }
  }
  .note.drop > :not(.bigheart) { animation: rise .5s var(--spring) both; }
  .note.drop > :nth-child(1) { animation-delay: .1s; }
  .note.drop > :nth-child(2) { animation-delay: .16s; }
  .note.drop > :nth-child(3) { animation-delay: .22s; }
  .note.drop > :nth-child(4) { animation-delay: .28s; }

  /* tab content — clear rise on every switch */
  .view.on > * { animation: rise .48s var(--spring) both !important; }
  .view.on > *:nth-child(2) { animation-delay: .05s !important; }
  .view.on > *:nth-child(3) { animation-delay: .1s !important; }
  .view.on > *:nth-child(4) { animation-delay: .15s !important; }
  .view.on > *:nth-child(5) { animation-delay: .2s !important; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  /* heart pop — bigger bounce */
  .act.pop .ic { animation: heartPop .5s var(--spring-bounce) !important; }
  @keyframes heartPop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.45); }
    60%  { transform: scale(.92); }
    100% { transform: scale(1); }
  }
  .act.snap .ic { animation: snapMark .48s var(--spring-bounce) !important; transform-origin: 50% 100%; }
  @keyframes snapMark {
    0%   { transform: scale(1); }
    25%  { transform: scale(.8, 1.2); }
    55%  { transform: scale(1.15, .9); }
    100% { transform: scale(1); }
  }

  /* bottom nav — stronger glass + hop */
  nav {
    background: rgba(255, 255, 255, .78) !important;
    -webkit-backdrop-filter: saturate(200%) blur(24px) !important;
    backdrop-filter: saturate(200%) blur(24px) !important;
    transition: transform .36s var(--spring) !important;
  }
  nav button[aria-current="page"] .pill {
    animation: pillIn .45s var(--spring-bounce) !important;
  }
  nav button[aria-current="page"] .ic {
    animation: navHop .5s var(--spring-bounce) !important;
  }
  @keyframes pillIn {
    from { transform: scale(.4); opacity: .3; }
    60%  { transform: scale(1.08); }
    to   { transform: none; opacity: 1; }
  }
  @keyframes navHop {
    0%   { transform: translateY(4px) scale(.8); }
    50%  { transform: translateY(-5px) scale(1.15); }
    100% { transform: none; }
  }
  body.typing nav { transform: translateY(110%) !important; }

  /* dialogs — clear sheet motion */
  dialog {
    border-radius: 24px !important;
    box-shadow: 0 28px 80px -12px rgba(0, 0, 0, .4), 0 0 0 1px rgba(0,0,0,.05) !important;
  }

    animation: sheetIn .45s var(--spring) !important;
  }
  @keyframes sheetIn {
    from { opacity: 0; transform: translateY(40px) scale(.94); }
    to   { opacity: 1; transform: none; }
  }
  dialog[open]::backdrop {
    animation: fade .3s ease !important;
    background: rgba(43, 38, 34, .48) !important;
    -webkit-backdrop-filter: blur(12px) saturate(150%) !important;
    backdrop-filter: blur(12px) saturate(150%) !important;

    animation: sheetUp .48s var(--spring) !important;

  /* toast */
  .toast {
    transition: opacity .25s ease, transform .42s var(--spring) !important;
    box-shadow: 0 16px 40px -8px rgba(0, 0, 0, .5) !important;
  }

  .pan { transition: grid-template-rows .42s var(--spring) !important; }

  .eico { animation: bob 2.6s ease-in-out infinite !important; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  .item { animation: rise .4s var(--spring) both !important; }

  textarea, input[type=text] {
    transition: border-color .25s var(--ease), box-shadow .25s var(--ease) !important;
  }
  textarea:focus, input[type=text]:focus {

  /* page crossfade helper used by JS */
  .wrap.switching {

  }

  /* global type polish */
  h1 {
    letter-spacing: -0.025em;
  }
  .tag {
    letter-spacing: 0.01em;
    font-weight: 500;
  }
  .note .text {
    letter-spacing: -0.015em;
    font-weight: 500;
  }
  .note .meta {
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .stat {
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .lb, .btn {
    letter-spacing: -0.01em;
  }


  /* ========== Dark mode ========== */
  html[data-theme="dark"] {
    --bg: #141210;
    --card: #1e1b18;
    --ink: #f3ebe1;
    --muted: #a89f94;
    --line: #2f2a25;
    --soft: #26211c;
    --amber: #f0b04a;
    --amber-soft: #3d3020;
    --sage: #6bb3a5;
    --danger: #ff6b63;
    --heart: #ff5a5f;
  }
  html[data-theme="dark"] body { color: var(--ink); background: var(--bg); }
  html[data-theme="dark"] nav {
    background: rgba(30, 27, 24, .86) !important;
    border-top-color: var(--line);
  }
  html[data-theme="dark"] .note {
    box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 18px 36px -18px rgba(0,0,0,.55);
  }
  html[data-theme="dark"] .note.empty {
    border-color: var(--line);
    background: transparent;
  }
  html[data-theme="dark"] textarea,
  html[data-theme="dark"] input[type=text],
  html[data-theme="dark"] .replyform input {
    background: var(--card);
    color: var(--ink);
    border-color: var(--line);
  }
  html[data-theme="dark"] dialog {
    background: var(--bg);
    color: var(--ink);
  }
  html[data-theme="dark"] .toast {
    background: rgba(243, 235, 225, .95);
    color: #1a1612;
  }
  html[data-theme="dark"] .btn.ghost {
    background: transparent; border-color: var(--line); color: var(--ink);
  }
  html[data-theme="dark"] .btn.ghost:active { background: var(--soft); }
  html[data-theme="dark"] .t-copy { background: var(--soft); color: var(--ink); }
  html[data-theme="dark"] .sendok {
    background: rgba(30, 27, 24, .96);
    border-color: var(--line);
  }
  html[data-theme="dark"] .sendok .ic { color: var(--sage); }
  html[data-theme="dark"] #v-me .sum,
  html[data-theme="dark"] #v-me .item {
    box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 12px 28px -16px rgba(0,0,0,.5);
  }

  /* theme toggle — single clean icon that swaps via CSS */
  .theme-btn {
    width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: var(--soft); color: var(--ink); cursor: pointer;
    display: grid; place-items: center; padding: 0; flex: none;
    transition: transform .28s var(--spring), background .25s var(--ease);
  }
  .theme-btn:active { transform: scale(.9); }
  .theme-btn svg {
    width: 18px; height: 18px; fill: none; stroke: currentColor;
    stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
    grid-area: 1 / 1;
  }
  .theme-btn .sun { display: block; }
  .theme-btn .moon { display: none; }
  html[data-theme="dark"] .theme-btn .sun { display: none; }
  html[data-theme="dark"] .theme-btn .moon { display: block; }
  .header-actions { display: flex; align-items: center; gap: 8px; flex: none; }
  @media (min-width: 380px) {
    .theme-btn { width: 40px; height: 40px; }
    .theme-btn svg { width: 20px; height: 20px; }
    .header-actions { gap: 10px; }
  }

  /* swipe note */
  #note.swiping { transition: none !important; }
  #note.swipe-hint::after {
    content: attr(data-hint);
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    font-size: 13px; color: var(--muted); opacity: .7; pointer-events: none;
    white-space: nowrap; font-weight: 500;
  }
  .note { touch-action: pan-y; }

  /* onboarding */
  #onboardDlg {
    width: min(92vw, 400px);
    border-radius: 28px;
    padding: 0;
    border: 0;
    background: var(--bg);
    color: var(--ink);
  }
  #onboardDlg::backdrop {
    background: rgba(20, 16, 12, .55);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .ob-in { padding: 28px 24px 22px; text-align: center; }
  .ob-logo {
    width: 56px; height: 68px; margin: 0 auto 14px;
    color: var(--amber);
  }
  .ob-logo svg { width: 100%; height: 100%; display: block; }
  .ob-in h2 {
    margin: 0 0 8px; font-size: 24px; font-weight: 700;
    letter-spacing: -0.02em; color: var(--ink);
  }
  .ob-in .ob-lead {
    margin: 0 0 22px; font-size: 16px; line-height: 1.55; color: var(--muted);
  }
  .ob-steps {
    display: grid; gap: 12px; text-align: left; margin: 0 0 24px;
  }
  .ob-step {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 14px;
  }
  .ob-num {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    background: var(--amber-soft); color: var(--ink);
    font-size: 14px; font-weight: 700;
    display: grid; place-items: center;
  }
  html[data-theme="dark"] .ob-num { background: var(--soft); color: var(--amber); }
  .ob-step strong {
    display: block; font-size: 15px; font-weight: 700; margin-bottom: 2px;
  }
  .ob-step span {
    font-size: 14px; color: var(--muted); line-height: 1.4;
  }
  .ob-in .btn { margin-top: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

// ---------- storage ----------
// 1) inside Claude's preview: window.storage   2) published page: shared notes in the `db` capability, personal data in localStorage
// 3) anything else: this device only
const store = (() => {
  const hasWS = !!(window.storage && typeof window.storage.get === 'function');
  const mem = new Map();
  const mk = (k, s) => (s ? 's:' : 'p:') + k;
  const lsGet = k => { try { return localStorage.getItem('dn:' + k); } catch { return mem.has(mk(k, false)) ? mem.get(mk(k, false)) : null; } };
  const lsSet = (k, v) => { try { localStorage.setItem('dn:' + k, v); } catch { mem.set(mk(k, false), v); } return true; };
  const lsDel = k => { try { localStorage.removeItem('dn:' + k); } catch {} mem.delete(mk(k, false)); return true; };
  let db = null, cache = { at: 0, map: new Map() };
  const docId = k => String(k).replace(/^msg:/, '');
  const self = {
    ok: hasWS, mode: hasWS ? 'ws' : 'mem', done: hasWS, lastError: '', listFailed: false,
    ready: Promise.resolve(),
    async get(k, s) {
      if (self.mode === 'ws') { try { const r = await window.storage.get(k, s); return r ? r.value : null; } catch { return null; } }
      if (!s) return lsGet(k);
      if (self.mode === 'db') {
        if (Date.now() - cache.at < 8000 && cache.map.has(k)) return cache.map.get(k);
        try { const d = await db.collection('notes').doc(docId(k)).get(); return d.exists ? (d.data() || {}).v || null : null; } catch { return null; }
      }
      return mem.has(mk(k, s)) ? mem.get(mk(k, s)) : null;
    },
    async set(k, v, s) {
      if (!s && self.mode !== 'ws') return lsSet(k, v);
      if (self.mode === 'mem') { mem.set(mk(k, s), v); return true; }
      for (let i = 0; i < 2; i++) {
        try {
          if (self.mode === 'ws') { const r = await window.storage.set(k, v, s); if (r) return true; self.lastError = 'storage.set returned empty (shared=' + s + ')'; }
          else { await db.collection('notes').doc(docId(k)).set({ v }); cache.map.set(k, v); return true; }
        } catch (e) { console.error(e); self.lastError = String((e && (e.code || e.message)) || e); if (e && e.code === 'invalid_argument') return false; }
        if (i === 0) await new Promise(r => setTimeout(r, 450));   // transient server errors: try once more
      }
      return false;
    },
    async del(k, s) {
      if (!s && self.mode !== 'ws') return lsDel(k);
      if (self.mode === 'mem') { mem.delete(mk(k, s)); return true; }
      try {
        if (self.mode === 'ws') await window.storage.delete(k, s);
        else { await db.collection('notes').doc(docId(k)).delete(); cache.map.delete(k); }
        return true;
      } catch { return false; }
    },
    async list(prefix, s) {
      if (!s && self.mode !== 'ws') return [...mem.keys()].filter(k => k.startsWith(mk(prefix, s))).map(k => k.slice(2));
      if (self.mode === 'mem') return [...mem.keys()].filter(k => k.startsWith(mk(prefix, s))).map(k => k.slice(2));
      try {
        if (self.mode === 'ws') { const r = await window.storage.list(prefix, s); self.listFailed = false; return r ? r.keys : []; }

      } catch { self.listFailed = true; return []; }
    }
  };

    self.ready = (async () => {
      try {
        if (window.claude && typeof window.claude.use === 'function') db = await Promise.race([window.claude.use('db'), new Promise(r => setTimeout(() => r(null), 6000))]);
      } catch { db = null; }
      if (db) { self.mode = 'db'; self.ok = true; }
      self.done = true;
    })();
  }
  return self;
})();

// Note keys look like "msg:" + base36 timestamp (8 chars) + random, so age is known without reading the note.
const keyTs = k => parseInt(String(k).slice(4, 12), 36) || 0;
async function loadAll(force) {

  const all = (await store.list('msg:', true)).sort().reverse();
  if (store.listFailed && msgs.length) return;   // keep what we have instead of wiping the list
  const cutoff = Date.now() - NOTE_LIFE;
  const keep = [], drop = [];
  all.forEach((k, i) => { const ts = keyTs(k); ((ts && ts < cutoff) || i >= MAX_NOTES ? drop : keep).push(k); });
  drop.slice(0, 40).forEach(k => { store.del(k, true).catch(() => {}); });   // auto clean-up keeps storage small
  const rows = await Promise.all(keep.map(async k => {
    const v = await store.get(k, true);

  }));
  msgs = rows.filter(m => {
    if (!m) return false;
    if (Date.now() - m.ts >= NOTE_LIFE) { store.del('msg:' + m.id, true).catch(() => {}); return false; }
    return true;
  });
  if (!store.listFailed) {
    const keepSet = new Set(keep); let changed = false;
    me.saved = me.saved.filter(id => {
      const live = keepSet.has('msg:' + id), s = me.snap[id];
      const ghost = !live && (!s || !s.text);
      const deleted = !live && s && s.ts && (Date.now() - s.ts) < NOTE_LIFE;   // not expired, so the author removed it
      if (ghost || deleted) { delete me.snap[id]; changed = true; return false; }
      return true;

// ---------- random pick (no repeats until you've seen everything) ----------
function pickRandom() {
  let pool = visible();
  const others = pool.filter(m => m.authorId !== me.id);
  if (others.length) pool = others;
  if (pool.length > 1) pool = pool.filter(m => m.id !== lastShownId);
  let fresh = pool.filter(m => !shown.has(m.id));
  if (!fresh.length) { shown.clear(); fresh = pool; }
  if (!fresh.length) return null;
  const w = fresh.map(m => (Date.now() - m.ts) < 2 * DAY ? 3 : 1);   // new notes get found a bit more often
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < fresh.length; i++) { r -= w[i]; if (r <= 0) return fresh[i]; }
  return fresh[fresh.length - 1];
}

  rxChain = rxChain.then(async () => { const r = await mutate(id, x => applyRx(x, cur, next)); if (!r) await checkGone(id); await saveMe(); }).catch(() => {});
}

async function toggleSave(m) {
  if (!m || !m.id) return;
  if (!me.saved.includes(m.id) && !m.text) return;   // never create an empty saved entry
  if (me.saved.includes(m.id)) {
    me.saved = me.saved.filter(x => x !== m.id); delete me.snap[m.id];
  } else {
    me.saved = [m.id, ...me.saved].slice(0, MAX_SAVED);
    me.snap[m.id] = { text: m.text, name: m.name || '', ts: m.ts };   // keep a copy so it stays after the note expires
    Object.keys(me.snap).forEach(k => { if (!me.saved.includes(k)) delete me.snap[k]; });
  }
  syncMark(m.id);
  await saveMe();
  const on = me.saved.includes(m.id);
  say(on ? t('savedSr') : t('unsavedSr')); toast(on ? t('savedSr') : t('unsavedSr'), 1400); haptic(6);
}

async function unsave(id) {
  if (!me.saved.includes(id)) return;
  me.saved = me.saved.filter(x => x !== id); delete me.snap[id];
  syncMark(id); renderMe(); toast(t('unsavedSr'), 1400); haptic(6);
  await saveMe();
}

function askReason() {
  return new Promise(res => {
    const d = $('reportDlg'), box = $('rpReasons'); box.textContent = '';
    REPORT_REASONS.forEach((id, i) => radioChip(box, 'rr', id, t('rr_' + id), i === 0));
    let settled = false;
    const done = v => { if (settled) return; settled = true; res(v); if (d.open) d.close(); };
    $('rpYes').onclick = () => done(checked('rr') || 'other');
    $('rpNo').onclick = () => done(null);

async function report(id) {
  if (me.reported.includes(id)) return;
  const why = await askReason();
  if (!why) return;
  await mutate(id, x => { x.reports = (x.reports || 0) + 1; x.rr = x.rr || {}; x.rr[why] = (x.rr[why] || 0) + 1; });
  me.reported.push(id); await saveMe();
  current = null; setEmpty('emptyHome'); toast(t('reported'));
}

async function removeMine(id) {
  if (!await ask(t('deleteConfirm'), t('deleteYes'))) return;
  const ok = await store.del('msg:' + id, true);
  if (!ok) { toast(t('delFail')); return; }
  msgs = msgs.filter(m => m.id !== id);
  if (me.saved.includes(id)) { me.saved = me.saved.filter(x => x !== id); delete me.snap[id]; saveMe(); }
  if (current && current.id === id) { current = null; setEmpty('emptyHome'); }
  renderMe(); renderHome(); toast(t('deleted'), 1400);
}

function countView(m) {
  if (m.authorId === me.id || seenViews.has(m.id)) return;
  seenViews.add(m.id);
  m.views = (m.views || 0) + 1;
  mutate(m.id, x => { x.views = (x.views || 0) + 1; }).catch(() => {});
}

async function addReply(id, text) {
  const r = { id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), text, name: me.name, authorId: me.id, ts: Date.now() };

  const m = await mutate(id, x => {

const DROP = new Path2D('M13 1C13 1 2 14 2 21a11 11 0 0 0 22 0C24 14 13 1 13 1z');
const HEART_P = new Path2D('M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z');
const SEG = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('th', { granularity: 'word' }) : null;

function wrapLines(ctx, text, maxW) {
  const src = String(text).replace(/\r\n?/g, '\n');
  const parts = SEG ? [...SEG.segment(src)].map(s => s.segment) : [...src];
  const pieces = parts.flatMap(w => (w !== '\n' && ctx.measureText(w).width > maxW) ? [...w] : [w]);
  const lines = []; let line = '';
  for (const w of pieces) {
    if (w === '\n') { lines.push(line.trimEnd()); line = ''; continue; }
    const tt = line + w;
    if (ctx.measureText(tt).width > maxW && line.trim()) { lines.push(line.trimEnd()); line = w.trimStart(); } else line = tt;
  }
  if (line.trim() || !lines.length) lines.push(line.trimEnd());
  return lines;
}
// same number of lines, but the narrowest width that still fits, so lines come out even (no lonely last word)
function wrapBalanced(ctx, text, maxW) {
  const base = wrapLines(ctx, text, maxW);
  if (base.length < 2 || String(text).includes('\n')) return base;
  let lo = maxW * 0.4, hi = maxW, best = maxW;
  for (let i = 0; i < 12; i++) {
    const mid = (lo + hi) / 2;
    if (wrapLines(ctx, text, mid).length <= base.length) { best = mid; hi = mid; } else lo = mid;
  }
  return wrapLines(ctx, text, best);
}

async function ensureBlob() {
  if (shareBlob && shareBlob.size > 0) return shareBlob;
  if (shareBlobPromise) {
    try {
      const b = await Promise.race([shareBlobPromise, sleep(2500).then(() => null)]);
      if (b && b.size > 0) { shareBlob = b; return b; }
    } catch {}
  }
  try {
    const b = await getBlob();
    if (b && b.size > 0) { shareBlob = b; return b; }
  } catch {}
  if (shareDataUrl) {
    try {
      const res = await fetch(shareDataUrl);
      const fb = await res.blob();
      if (fb && fb.size > 0) { shareBlob = fb; return fb; }
    } catch {}
  }
  // rebuild from canvas immediately
  try {
    const c = drawShare(shareNote);
    shareDataUrl = c.toDataURL('image/png');
    const b = await new Promise(r => { try { c.toBlob(x => r(x || null), 'image/png'); } catch { r(null); } });
    if (b && b.size > 0) { shareBlob = b; return b; }
  } catch {}
  return null;
}

async function copyImage() {

    const blob = await ensureBlob();
    if (!blob) return false;
    if (navigator.clipboard && window.ClipboardItem) {

      return true;
    }
  } catch {}

}

function forceDownload(href) {
  try {
    const a = document.createElement('a');
    a.href = href;
    a.download = 'dropnote-' + Date.now() + '.png';
    a.target = '_self';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { try { a.remove(); } catch {} }, 1500);
    return true;
  } catch { return false; }
}

async function downloadImage(blob) {
  // Always try data URL first — most reliable across mobile browsers
  let dataUrl = shareDataUrl;
  if (!dataUrl && blob) {
    try {
      dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(blob);
      });
    } catch {}
  }
  if (!dataUrl && shareNote) {
    try {
      const c = drawShare(shareNote);
      dataUrl = c.toDataURL('image/png');
      shareDataUrl = dataUrl;
    } catch {}
  }

  // 1) Host API
  try {
    if (blob && window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) {
        try { await dl.save({ filename: 'dropnote.png', data: blob }); }
        catch (e) { if (!(e && e.code === 'declined')) throw e; }
        return true;
      }
    }
  } catch {}

  // 2) Data URL download (best for mobile Chrome / Safari outside strict WebViews)
  if (dataUrl && forceDownload(dataUrl)) return true;

  // 3) Blob object URL
  if (blob) {
    try {
      const url = URL.createObjectURL(blob);
      const ok = forceDownload(url);
      setTimeout(() => { try { URL.revokeObjectURL(url); } catch {} }, 30000);
      if (ok) return true;
    } catch {}
  }

  // 4) Guaranteed path: full-screen image for long-press save
  if (dataUrl) {
    showSaveOverlay(dataUrl);
    return true;
  }
  return false;
}

// ---------- swipe to next note ----------
(function setupSwipe() {
  const n = $('note');
  if (!n) return;
  let x0 = 0, y0 = 0, dx = 0, dy = 0, tracking = false, locked = false;
  const THRESH = 72;
  n.addEventListener('pointerdown', e => {
    if (n.classList.contains('empty')) return;
    if (e.target.closest('button, a, input, textarea, .replies')) return;
    tracking = true; locked = false; dx = 0; dy = 0;
    x0 = e.clientX; y0 = e.clientY;
    n.classList.add('swiping');
    try { n.setPointerCapture(e.pointerId); } catch {}
  });
  n.addEventListener('pointermove', e => {
    if (!tracking) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    if (!locked) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dy) > Math.abs(dx)) { tracking = false; n.classList.remove('swiping'); n.style.transform = ''; return; }
      locked = true;
    }
    e.preventDefault();
    const rot = dx * 0.04;
    const op = Math.max(0.55, 1 - Math.abs(dx) / 420);
    n.style.transform = 'translateX(' + dx + 'px) rotate(' + rot + 'deg)';
    n.style.opacity = String(op);
  });
  const end = e => {
    if (!tracking) return;
    tracking = false; n.classList.remove('swiping');
    const go = locked && Math.abs(dx) > THRESH;
    n.style.transition = 'transform .32s var(--spring), opacity .28s var(--ease)';
    if (go) {
      const dir = dx > 0 ? 1 : -1;
      n.style.transform = 'translateX(' + (dir * 120) + '%) rotate(' + (dir * 8) + 'deg)';
      n.style.opacity = '0';
      haptic(10);
      setTimeout(() => {
        n.style.transition = '';
        n.style.transform = '';
        n.style.opacity = '';
        pickNow();
      }, 220);
    } else {
      n.style.transform = '';
      n.style.opacity = '';
      setTimeout(() => { n.style.transition = ''; }, 320);
    }
  };
  n.addEventListener('pointerup', end);
  n.addEventListener('pointercancel', end);
})();

    await loadAll(true);
    if (msgs.some(m => m.text === text)) { out.className = 'msg err'; out.textContent = t('dup'); return; }
    const now = Date.now();
    const m = norm({ id: now.toString(36) + Math.random().toString(36).slice(2, 6), text, name, authorId: me.id, ts: now });
    let ok = await store.set('msg:' + m.id, JSON.stringify(m), true), localOnly = false;
    if (!ok) {
      console.error('shared save failed:', store.lastError);
      ok = await store.set('msg:' + m.id, JSON.stringify(m), false);
      if (ok) localOnly = true;
      else { out.className = 'msg err'; out.textContent = t('postFail'); return; }
    }
    msgs.unshift(m); me.name = name; me.lastPost = now; me.draft = ''; await saveMe();
    haptic(14);
    const w = $('tawrap'), nick = $('nick');
    // 1) pulse the field
    w.classList.remove('fly', 'back');
    restart(w, 'sending');
    nick.classList.add('dim');
    await sleep(320);
    // 2) confetti-ish dots from center
    const burst = el('div', 'sendburst');
    for (let i = 0; i < 12; i++) {
      const d = document.createElement('i');
      const a = (i / 12) * Math.PI * 2 + Math.random() * 0.3;
      const dist = 48 + Math.random() * 70;
      d.style.left = '50%'; d.style.top = '45%';
      d.style.setProperty('--dx', Math.cos(a) * dist + 'px');
      d.style.setProperty('--dy', Math.sin(a) * dist + 'px');
      d.style.animationDelay = (i * 0.02) + 's';
      d.style.background = i % 3 === 0 ? 'var(--amber)' : (i % 3 === 1 ? 'var(--sage)' : 'var(--heart)');
      burst.append(d);
    }
    w.append(burst);
    // 3) success checkmark only (center of field)
    const okBadge = el('div', 'sendok');
    const okIc = el('span', 'ic');
    okIc.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICON.check + '</svg>';
    okBadge.append(okIc);
    w.append(okBadge);
    setSendState(true);
    if (localOnly) toast(t('localOnly'), 2200);
    else toast(t('posted'), 1600);
    await sleep(520);
    // 4) field flies up
    w.classList.remove('sending');
    w.classList.add('fly');
    await sleep(520);
    $('txt').value = ''; updateCount();
    burst.remove(); okBadge.classList.add('out');
    await sleep(180);
    okBadge.remove();
    w.classList.remove('fly');
    restart(w, 'back');
    nick.classList.remove('dim');
    renderHome();
    await sleep(900);
    setSendState(false);
  } finally { sending = false; $('send').classList.remove('busy'); }
};

// refresh when the app comes back to the foreground
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || Date.now() - loadedAt < 60000) return;
  await loadAll(true).catch(() => {});
  const v = (document.querySelector('.view.on') || {}).id;
  if (v === 'v-home') renderHome();
  if (v === 'v-me') renderMe();
});

// ---------- init ----------
(async function init() {
  applyLang();
  await store.ready;
  $('banner').style.display = 'none';   /* never show trial/demo banner */
  const raw = await store.get('me', false);
  if (raw) {
    try {
      const p = JSON.parse(raw); Object.assign(me, p);
      if (Array.isArray(p.liked)) { p.liked.forEach(id => { me.rx[id] = { t: 'heart', at: 0 }; }); delete me.liked; }
    } catch {}
  }
  me.rx = me.rx || {}; me.saved = me.saved || []; me.snap = me.snap || {}; me.reported = me.reported || [];
  const sh = me.sh || {};
  if (THEMES[sh.style]) shareStyle = manualStyle = sh.style;
  if (typeof sh.auto === 'boolean') shareAuto = sh.auto;
  if (Array.isArray(sh.fav)) shareFav = sh.fav.filter(id => THEMES[id]);
  if (FONTS[sh.font]) shareFont = sh.font;
  if (SHARE_FMT[sh.fmt]) shareFmt = sh.fmt;
  if (Number.isInteger(sh.level)) shareLevel = Math.max(-6, Math.min(8, sh.level));
  if (me.lang === 'en' || me.lang === 'th') { lang = me.lang; applyLang(); }
  $('nick').value = me.name || '';
  if (me.draft) { $('txt').value = me.draft; updateCount(); }
  setSendState(false);
  if (!me.theme) me.theme = systemTheme();
  applyTheme(me.theme);
  const tb = $('themeBtn'); if (tb) tb.onclick = toggleTheme;
  await saveMe();
  await loadAll(true);
  pruneMe();
  renderHome();
  maybeOnboard();
})();
</script>
